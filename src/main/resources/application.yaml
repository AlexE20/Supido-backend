spring:
  application:
    name: Supido
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      SUPER_ADMIN_USERNAME: ${ADMIN_USER}
      SUPER_ADMIN_PASSWORD_HASH: ${ADMIN_PASS}
      SUPER_ADMIN_EMAIL: ${ADMIN_EMAIL}
      SUPER_ADMIN_PHONE: ${ADMIN_PHONE}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}